name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Lint
        run: swift format lint --recursive --strict Sources Tests Package.swift
      - name: Test
        run: swift test
      - name: Build app bundle
        run: bash ./Scripts/build-app.sh
